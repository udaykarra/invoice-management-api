[tool.mutmut]
paths_to_mutate = "app/crud.py"
tests_dir = "tests/"
runner = "pytest -x --tb=no"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "postgres: tests requiring a running PostgreSQL database instance",
]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

