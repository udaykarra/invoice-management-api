name: Build, Verify & Test Invoice API

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Ruff Linting
      run: |
        ruff check app tests tasks verifier.py scripts

    - name: Run Mypy Type Checking
      run: |
        mypy app

    - name: Run Unit Tests & Coverage
      run: |
        pytest tests/test_invoices.py --cov=app --cov-report=term-missing --tb=short

    - name: Run Concurrent Idempotency Stress Tests
      run: |
        pytest tests/test_concurrency.py -v --tb=short

    - name: Run PostgreSQL Integration Tests
      env:
        TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/invoice_test
      run: |
        pytest tests/test_postgres_integration.py -v --tb=short

    - name: Execute Deterministic Contract Verifier & Benchmarks
      run: |
        python verifier.py

    - name: Run Automated Mutation Testing
      run: |
        python scripts/run_mutation_tests.py
